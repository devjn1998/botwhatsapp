# render.yaml - Versão 5 (Híbrida e Final)
# Define apenas os serviços que podem ser gerenciados pelo arquivo.
# O banco de dados é criado manualmente no painel do Render.

services:
  # Serviço Único: A API da Evolution.
  - type: web
    name: evolution-api
    env: docker
    image:
      url: atendai/evolution-api:latest
    healthCheckPath: /
    envVars:
      # Chave da API para proteger nosso endpoint.
      - key: AUTHENTICATION_API_KEY
        value: "{=*?p-p$(f_~~EW&"

      # Conexão com o banco de dados criado manualmente.
      # Cole a "Internal Database URL" do seu banco de dados do Render aqui.
      - key: DATABASE_URL
        value: "postgresql://evolution_db_84gi_user:VNoNZJUHa02iP6rtqE03e0u11OGpxES2@dpg-d213d03ipnbc73dtk0ig-a/evolution_db_84gi"

      # Forçamos o uso de SSL, que é necessário para conexões externas no Render.
      - key: DATABASE_EXTRA_PARAMS
        value: "?ssl=true"

    # Disco para salvar a sessão do WhatsApp (QR Code, etc).
    disk:
      name: evolution-instances
      mountPath: /evolution/instances
      sizeGB: 1
