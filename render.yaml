# render.yaml - Versão 6 (Mínima e Direta)

services:
  - type: web
    name: evolution-api
    env: docker
    image:
      url: atendai/evolution-api:latest
    healthCheckPath: /
    # As variáveis de ambiente (envVars) serão gerenciadas
    # diretamente no painel do Render para evitar conflitos.
    disk:
      name: evolution-instances
      mountPath: /evolution/instances
      sizeGB: 1
