# render.yaml - Versão 3 (Robusta e Simplificada)
# Infraestrutura como código otimizada para o Render.

services:
  # Serviço 1: Banco de Dados PostgreSQL.
  # Esta é a fonte da verdade. O Render gerencia a criação e as credenciais.
  - type: pserv
    name: db
    image:
      url: postgres:15
    disk:
      name: pgdata
      mountPath: /var/lib/postgresql/data
      sizeGB: 1

  # Serviço 2: API da Evolution.
  # Configurada para consumir as credenciais do banco de dados de forma segura.
  - type: web
    name: evolution-api
    env: docker
    image:
      url: atendai/evolution-api:latest
    healthCheckPath: /
    envVars:
      # Chave da API para proteger nosso endpoint.
      - key: AUTHENTICATION_API_KEY
        value: "{=*?p-p$(f_~~EW&"

      # A ÚNICA variável de banco de dados necessária.
      # O Render injeta a URL de conexão completa e segura do nosso serviço 'db'.
      # A Evolution API é inteligente o suficiente para analisar esta URL.
      - key: DATABASE_URL
        fromService:
          type: pserv
          name: db
          property: connectionString

      # Forçamos o uso de SSL, que é necessário para conexões externas no Render.
      - key: DATABASE_EXTRA_PARAMS
        value: "?ssl=true"

    # Disco para salvar a sessão do WhatsApp (QR Code, etc).
    disk:
      name: evolution-instances
      mountPath: /evolution/instances
      sizeGB: 1
