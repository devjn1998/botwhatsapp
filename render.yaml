# render.yaml - Versão 4 (Com Tipos Nativos do Render)
# Infraestrutura como código usando os tipos de serviço específicos do Render.

services:
  # Serviço 1: O Banco de Dados PostgreSQL, usando o tipo nativo do Render.
  - type: postgres
    name: db
    ipAllowList: [] # Permite acesso de qualquer lugar (necessário para a API se conectar)

  # Serviço 2: A API da Evolution.
  - type: web
    name: evolution-api
    env: docker
    image:
      url: atendai/evolution-api:latest
    healthCheckPath: /
    envVars:
      # Chave da API para proteger nosso endpoint.
      - key: AUTHENTICATION_API_KEY
        value: "{=*?p-p$(f_~~EW&"

      # A ÚNICA variável de banco de dados necessária.
      # Usamos a URL de conexão segura que o Render cria para seu banco de dados nativo.
      - key: DATABASE_URL
        fromDatabase:
          name: db # O nome do nosso serviço de banco de dados acima.
          property: connectionString

      # Forçamos o uso de SSL, que é necessário para conexões externas no Render.
      - key: DATABASE_EXTRA_PARAMS
        value: "?ssl=true"

    # Disco para salvar a sessão do WhatsApp (QR Code, etc).
    disk:
      name: evolution-instances
      mountPath: /evolution/instances
      sizeGB: 1
